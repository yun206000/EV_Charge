# legacy environment (Python 3.8) of the trained models and reported results, see docker/legacy-py38/Dockerfile
# Conda environment of PCRL, exported with `conda env export -n PCRL --no-builds` (2026-11-09).
# Conda packages only; the pip packages are in requirements-pcrl.txt (gym 0.21.0 needs old pip/setuptools, see Dockerfile).
# Locally:  conda env create -f environment.yml && conda activate PCRL
#           python -m pip install pip==23.1.2 setuptools==65.5.0 wheel==0.38.4
#           python -m pip install --no-build-isolation -r requirements-pcrl.txt
name: PCRL
channels:
  - defaults
dependencies:
  - _libgcc_mutex=0.1
  - _openmp_mutex=5.1
  - blas=1.0
  - brotli-python=1.0.9
  - ca-certificates=2026.8.13
  - joblib=1.4.2
  - ld_impl_linux-64=2.44
  - libffi=3.4.8
  - libgcc=15.2.0
  - libgcc-ng=15.2.0
  - libgfortran=15.2.0
  - libgfortran-ng=15.2.0
  - libgfortran5=15.2.0
  - libgomp=15.2.0
  - libopenblas=0.3.31
  - libstdcxx=15.2.0
  - libstdcxx-ng=15.2.0
  - libxcb=1.17.0
  - libzlib=1.3.2
  - ncurses=6.6
  - numpy-base=1.24.3
  - openssl=3.5.8
  - platformdirs=3.10.0
  - pooch=1.7.0
  - pthread-stubs=0.3
  - pysocks=1.7.1
  - python=3.8.20
  - readline=8.3
  - scikit-learn=1.3.0
  - scipy=1.10.1
  - sqlite=3.53.4
  - threadpoolctl=3.5.0
  - tk=8.6.15
  - xorg-libx11=1.8.13
  - xorg-libxau=1.0.12
  - xorg-libxdmcp=1.1.5
  - xorg-xorgproto=2025.1
  - xz=5.8.2
  - zlib=1.3.2
