# SonarQube analysis of the PCRL code (README_for_doc.md section 11.7)
# first write the coverage of the unit tests: python -m pytest --cov --cov-report=xml   (-> coverage.xml)
#   docker run --rm --network host -u "$(id -u):$(id -g)" -e SONAR_HOST_URL=http://localhost:9000 \
#       -e SONAR_TOKEN=<token> -e SONAR_USER_HOME=/tmp/sonar -v "$PWD":/usr/src:ro sonarsource/sonar-scanner-cli \
#       -Dsonar.working.directory=/tmp/scannerwork   (the image presets a working directory the host user cannot write)
sonar.projectKey=pcrl
sonar.projectName=PCRL
sonar.sources=.
sonar.python.version=3.8
sonar.scm.disabled=true
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml
# code only: input data, outputs, caches, the coverage report and the local secrets file are not analysed
sonar.exclusions=cache/**,Graph/**,Results/**,runs/**,tmp_*/**,Images/**,logs/**,**/*.pkl,**/*.zip,**/*.graphml,**/*.json,**/*.txt,**/*.csv,docker/.env,tests/**,coverage.xml,.coverage,.git/**
