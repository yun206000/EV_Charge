# SonarQube analysis of the PCRL code (README_for_doc.md section 11.7)
# first write the coverage of the unit tests: python -m pytest --cov --cov-report=xml   (-> coverage.xml)
# and the dependency vulnerability scan: scripts/dependency_audit.sh   (-> dependency-audit-sonar.json)
#   docker run --rm --network host -u "$(id -u):$(id -g)" -e SONAR_HOST_URL=http://localhost:9000 \
#       -e SONAR_TOKEN=<token> -e SONAR_USER_HOME=/tmp/sonar -v "$PWD":/usr/src:ro sonarsource/sonar-scanner-cli \
#       -Dsonar.working.directory=/tmp/scannerwork   (the image presets a working directory the host user cannot write)
sonar.projectKey=pcrl
sonar.projectName=PCRL
sonar.sources=.
sonar.python.version=3.8, 3.12
sonar.scm.disabled=true
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml
# known vulnerabilities of the pinned packages (pip-audit), one issue on the line that pins each package
sonar.externalIssuesReportPaths=dependency-audit-sonar.json
# code and the files that pin the dependencies (docker/requirements-*.txt, environment.yml, Dockerfile); input data,
# outputs, caches, the coverage / audit reports and the local secrets file are not analysed
sonar.exclusions=cache/**,Graph/**,Results/**,runs/**,tmp_*/**,Images/**,logs/**,**/*.pkl,**/*.zip,**/*.graphml,**/*.json,**/*.csv,docker/.env,tests/**,coverage.xml,.coverage,dependency-audit-sonar.json,.git/**
